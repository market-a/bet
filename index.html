<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ميدو بيت - النظام المتكامل</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <style>
        :root { --primary: #10b981; --bg: #0f172a; --card: #1e293b; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: var(--bg); color: white; text-align: center; margin: 0; padding: 20px; }
        .container { max-width: 500px; margin: auto; background: var(--card); padding: 25px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        
        input { width: 90%; margin: 10px 0; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: white; text-align: center; }
        button { width: 95%; margin: 10px 0; padding: 12px; border-radius: 8px; border: none; background: var(--primary); color: white; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:hover { opacity: 0.8; transform: translateY(-2px); }
        
        .balance-box { background: linear-gradient(45deg, #f59e0b, #d97706); padding: 20px; border-radius: 15px; font-size: 22px; font-weight: bold; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(245, 158, 11, 0.3); }
        .hidden { display: none !important; }
        
        .whatsapp-btn { background-color: #25D366; color: white; text-decoration: none; padding: 15px; border-radius: 10px; display: block; margin: 15px auto; font-weight: bold; width: 85%; }
        
        .game-card { background: #131e32; border: 2px solid #38bdf8; padding: 15px; border-radius: 15px; margin-top: 20px; }
        .history-table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 13px; background: #334155; border-radius: 10px; overflow: hidden; }
        th, td { padding: 10px; border-bottom: 1px solid #475569; text-align: center; }
        th { background: #475569; color: #fbbf24; }
        .in { color: #4ade80; } .out { color: #f87171; }

        #loading { padding: 50px; font-size: 20px; color: #38bdf8; }
    </style>
</head>
<body>

<div class="container">
    <h1 style="color: #38bdf8; margin-bottom: 5px;">MEDO BET</h1>
    <p id="statusMsg" style="font-size: 12px; color: #94a3b8;">جاري التحقق من الاتصال...</p>

    <div id="loading">جاري التحميل...</div>

    <div id="authSection" class="hidden">
        <h3>تسجيل الدخول / اشتراك</h3>
        <input type="email" id="email" placeholder="البريد الإلكتروني">
        <input type="password" id="password" placeholder="كلمة المرور">
        <button onclick="login()">دخول</button>
        <button onclick="register()" style="background: #3b82f6;">إنشاء حساب جديد</button>
        <p id="errorLog" style="color: #f87171; font-size: 14px;"></p>
    </div>

    <div id="userSection" class="hidden">
        <div class="balance-box">
            رصيدك: <span id="u_balance">0</span> كوينز<br>
            <small style="font-size: 13px;">ID الحساب: <span id="u_id" style="color: #0f172a;">--------</span></small>
        </div>

        <a href="https://wa.me/+201124680211" target="_blank" class="whatsapp-btn">
            🟢 اضغط هنا للشحن (واتساب)
        </a>

        <div class="game-card">
            <h4>🍎 لعبة التفاحة (فوز 20%)</h4>
            <input type="number" id="betAmount" placeholder="مبلغ الرهان">
            <button onclick="playAppleGame()" style="background: #8b5cf6;">إبدأ اللعب</button>
            <p id="gameMsg" style="font-weight: bold;"></p>
        </div>

        <div style="overflow-x: auto;">
            <h4>📜 آخر 20 عملية</h4>
            <table class="history-table">
                <thead>
                    <tr><th>النوع</th><th>الطرف</th><th>المبلغ</th><th>التاريخ</th></tr>
                </thead>
                <tbody id="historyBody"></tbody>
            </table>
        </div>
        <button onclick="logout()" style="background: #64748b; margin-top: 20px;">خروج</button>
    </div>

    <div id="adminSection" class="hidden">
        <div class="balance-box" style="background: #ef4444;">لوحة تحكم المدير</div>
        <button onclick="generateMillion()" style="background: #7c3aed;">➕ توليد مليون كوينز</button>
        <hr style="border-color: #334155;">
        <h4>إرسال كوينز للاعب</h4>
        <input type="number" id="targetId" placeholder="ID اللاعب (8 أرقام)">
        <input type="number" id="sendAmount" placeholder="الكمية">
        <button onclick="adminSend()">إرسال الآن</button>
        <p id="adminMsg"></p>
        <button onclick="logout()" style="background: #64748b;">خروج</button>
    </div>
</div>

<script>
    // الإعدادات الخاصة بك
    const firebaseConfig = {
        apiKey: "AIzaSyBhIrY6VIp4VmxhFzyfpYGHK2MfNiuaflw",
        authDomain: "medobet-e65fe.firebaseapp.com",
        projectId: "medobet-e65fe",
        storageBucket: "medobet-e65fe.firebasestorage.app",
        messagingSenderId: "257706037859",
        appId: "1:257706037859:web:acd2d7eff8109fad15de56",
        measurementId: "G-9GMH9TW1ZQ"
    };

    // بدء العمل
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    // دالة إنشاء حساب
    function register() {
        const email = document.getElementById('email').value.trim();
        const pass = document.getElementById('password').value;
        if(pass.length < 6) return alert("الباصورد ضعيف");

        auth.createUserWithEmailAndPassword(email, pass).then(res => {
            const randomId = Math.floor(10000000 + Math.random() * 90000000).toString();
            db.collection("users").doc(res.user.uid).set({
                email: email,
                balance: 0,
                customId: randomId,
                isAdmin: (email === "1@gmail.com")
            });
        }).catch(err => alert(err.message));
    }

    // دالة دخول
    function login() {
        const email = document.getElementById('email').value.trim();
        const pass = document.getElementById('password').value;
        auth.signInWithEmailAndPassword(email, pass).catch(err => alert("خطأ في البيانات"));
    }

    function logout() { auth.signOut(); location.reload(); }

    // التحكم في ظهور الشاشات
    auth.onAuthStateChanged(user => {
        document.getElementById('loading').classList.add('hidden');
        if (user) {
            document.getElementById('authSection').classList.add('hidden');
            db.collection("users").doc(user.uid).onSnapshot(doc => {
                if(doc.exists) {
                    const data = doc.data();
                    if(data.email === "1@gmail.com") {
                        document.getElementById('adminSection').classList.remove('hidden');
                        document.getElementById('userSection').classList.add('hidden');
                    } else {
                        document.getElementById('userSection').classList.remove('hidden');
                        document.getElementById('adminSection').classList.add('hidden');
                        document.getElementById('u_balance').innerText = data.balance.toLocaleString();
                        document.getElementById('u_id').innerText = data.customId;
                        loadLogs(data.customId);
                    }
                    document.getElementById('statusMsg').innerText = "متصل: " + data.email;
                }
            });
        } else {
            document.getElementById('authSection').classList.remove('hidden');
            document.getElementById('userSection').classList.add('hidden');
            document.getElementById('adminSection').classList.add('hidden');
            document.getElementById('statusMsg').innerText = "غير متصل - سجل دخولك";
        }
    });

    // لعبة التفاحة
    function playAppleGame() {
        const amt = parseInt(document.getElementById('betAmount').value);
        if(!amt || amt <= 0) return;

        db.collection("users").doc(auth.currentUser.uid).get().then(doc => {
            const bal = doc.data().balance;
            if(bal < amt) return alert("رصيدك لا يكفي");

            let newBal = bal - amt;
            const win = Math.random() <= 0.20; // 20%
            if(win) {
                newBal += (amt * 2);
                document.getElementById('gameMsg').innerText = "🎉 مبروك! كسبت " + (amt*2);
                document.getElementById('gameMsg').style.color = "#4ade80";
            } else {
                document.getElementById('gameMsg').innerText = "😢 خسرت! حاول مرة أخرى";
                document.getElementById('gameMsg').style.color = "#f87171";
            }
            db.collection("users").doc(auth.currentUser.uid).update({ balance: newBal });
        });
    }

    // سجل التحويلات
    function loadLogs(myId) {
        db.collection("transactions").where("involvedIds", "array-contains", myId)
        .orderBy("timestamp", "desc").limit(20).onSnapshot(snap => {
            let h = "";
            snap.forEach(doc => {
                const d = doc.data();
                const isIn = d.toId === myId;
                h += `<tr>
                    <td class="${isIn?'in':'out'}">${isIn?'استلام':'إرسال'}</td>
                    <td>${isIn?d.fromId:d.toId}</td>
                    <td>${d.amount}</td>
                    <td>${d.timestamp ? d.timestamp.toDate().toLocaleTimeString('ar-EG') : '...'}</td>
                </tr>`;
            });
            document.getElementById('historyBody').innerHTML = h;
        });
    }

    // وظائف الأدمن
    function generateMillion() {
        db.collection("users").doc(auth.currentUser.uid).update({
            balance: firebase.firestore.FieldValue.increment(1000000)
        }).then(()=>alert("تم توليد مليون كوينز"));
    }

    function adminSend() {
        const tid = document.getElementById('targetId').value;
        const amt = parseInt(document.getElementById('sendAmount').value);
        if(!tid || !amt) return;

        db.collection("users").where("customId", "==", tid).get().then(snap => {
            if(snap.empty) return alert("ID غير موجود");
            const uDoc = snap.docs[0];
            db.collection("users").doc(uDoc.id).update({
                balance: firebase.firestore.FieldValue.increment(amt)
            });
            db.collection("transactions").add({
                fromId: "ADMIN", toId: tid, amount: amt,
                involvedIds: [tid, "ADMIN"],
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            });
            alert("تم الإرسال");
        });
    }
</script>
</body>
</html>
