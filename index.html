<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ميدو بيت - النظام المتكامل (تحديث v9)</title>
    <style>
        :root { --primary: #10b981; --bg: #0f172a; --card: #1e293b; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: var(--bg); color: white; text-align: center; margin: 0; padding: 20px; }
        .container { max-width: 500px; margin: auto; background: var(--card); padding: 25px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        
        input { width: 90%; margin: 10px 0; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: white; text-align: center; font-size: 16px; }
        button { width: 95%; margin: 10px 0; padding: 12px; border-radius: 8px; border: none; background: var(--primary); color: white; font-weight: bold; cursor: pointer; transition: 0.3s; font-size: 16px; }
        button:hover { opacity: 0.8; transform: translateY(-2px); }
        
        .balance-box { background: linear-gradient(45deg, #f59e0b, #d97706); padding: 20px; border-radius: 15px; font-size: 22px; font-weight: bold; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(245, 158, 11, 0.3); }
        .hidden { display: none !important; }
        
        .whatsapp-btn { background-color: #25D366; color: white; text-decoration: none; padding: 15px; border-radius: 10px; display: block; margin: 15px auto; font-weight: bold; width: 85%; }
        
        .game-card { background: #131e32; border: 2px solid #38bdf8; padding: 15px; border-radius: 15px; margin-top: 20px; }
        .history-table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 13px; background: #334155; border-radius: 10px; overflow: hidden; }
        th, td { padding: 10px; border-bottom: 1px solid #475569; text-align: center; }
        th { background: #475569; color: #fbbf24; }
        .in { color: #4ade80; } .out { color: #f87171; }

        #loading { padding: 50px; font-size: 20px; color: #38bdf8; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h1 style="color: #38bdf8; margin-bottom: 5px;">MEDO BET</h1>
    <p id="statusMsg" style="font-size: 12px; color: #94a3b8;">جاري الاتصال بالسيرفر...</p>

    <div id="loading">⏳ جاري التحميل... برجاء الانتظار</div>

    <div id="authSection" class="hidden">
        <h3>تسجيل الدخول / اشتراك</h3>
        <input type="email" id="email" placeholder="البريد الإلكتروني">
        <input type="password" id="password" placeholder="كلمة المرور">
        <button onclick="login()">دخول</button>
        <button onclick="register()" style="background: #3b82f6;">إنشاء حساب جديد</button>
        <p id="errorLog" style="color: #f87171; font-size: 14px; font-weight: bold;"></p>
    </div>

    <div id="userSection" class="hidden">
        <div class="balance-box">
            رصيدك: <span id="u_balance">0</span> كوينز<br>
            <small style="font-size: 13px;">ID الحساب: <span id="u_id" style="color: #0f172a;">--------</span></small>
        </div>

        <a href="https://wa.me/+201124680211" target="_blank" class="whatsapp-btn">
            🟢 اضغط هنا للشحن (واتساب)
        </a>

        <div class="game-card">
            <h4>🍎 لعبة التفاحة (فوز 20%)</h4>
            <input type="number" id="betAmount" placeholder="مبلغ الرهان">
            <button onclick="playAppleGame()" style="background: #8b5cf6;">إبدأ اللعب</button>
            <p id="gameMsg" style="font-weight: bold;"></p>
        </div>

        <div style="overflow-x: auto;">
            <h4>📜 آخر 20 عملية</h4>
            <table class="history-table">
                <thead>
                    <tr><th>النوع</th><th>الطرف</th><th>المبلغ</th><th>التاريخ</th></tr>
                </thead>
                <tbody id="historyBody"></tbody>
            </table>
        </div>
        <button onclick="logout()" style="background: #64748b; margin-top: 20px;">خروج</button>
    </div>

    <div id="adminSection" class="hidden">
        <div class="balance-box" style="background: #ef4444;">لوحة تحكم المدير</div>
        <button onclick="generateMillion()" style="background: #7c3aed;">➕ توليد مليون كوينز</button>
        <hr style="border-color: #334155;">
        <h4>إرسال كوينز للاعب</h4>
        <input type="number" id="targetId" placeholder="ID اللاعب (8 أرقام)">
        <input type="number" id="sendAmount" placeholder="الكمية">
        <button onclick="adminSend()">إرسال الآن</button>
        <p id="adminMsg" style="font-weight: bold;"></p>
        <button onclick="logout()" style="background: #64748b; margin-top: 15px;">خروج</button>
    </div>
</div>

<script type="module">
    // استيراد الدوال من فايربيز الإصدار الحديث
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-analytics.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc, onSnapshot, collection, query, where, orderBy, limit, addDoc, updateDoc, increment, serverTimestamp, getDocs } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-firestore.js";

    // إعدادات فايربيز الخاصة بك
    const firebaseConfig = {
        apiKey: "AIzaSyBhIrY6VIp4VmxhFzyfpYGHK2MfNiuaflw",
        authDomain: "medobet-e65fe.firebaseapp.com",
        projectId: "medobet-e65fe",
        storageBucket: "medobet-e65fe.firebasestorage.app",
        messagingSenderId: "257706037859",
        appId: "1:257706037859:web:acd2d7eff8109fad15de56",
        measurementId: "G-9GMH9TW1ZQ"
    };

    // تهيئة التطبيق
    const app = initializeApp(firebaseConfig);
    const analytics = getAnalytics(app);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // تعريف المتغيرات لتخزين بيانات المستخدم الحالي
    let currentUserId = null;
    let currentUserCustomId = null;

    // ------------------------------------
    // الدوال الخاصة بالمستخدمين (تسجيل ودخول)
    // ------------------------------------
    window.register = async function() {
        const email = document.getElementById('email').value.trim();
        const pass = document.getElementById('password').value;
        const errorLog = document.getElementById('errorLog');
        
        if(pass.length < 6) {
            errorLog.innerText = "كلمة المرور يجب أن تكون 6 أحرف على الأقل";
            return;
        }

        errorLog.innerText = "جاري الإنشاء...";
        errorLog.style.color = "#38bdf8";

        try {
            const userCredential = await createUserWithEmailAndPassword(auth, email, pass);
            const randomId = Math.floor(10000000 + Math.random() * 90000000).toString();
            
            await setDoc(doc(db, "users", userCredential.user.uid), {
                email: email,
                balance: 0,
                customId: randomId,
                isAdmin: (email === "1@gmail.com")
            });
            errorLog.innerText = "";
        } catch (err) {
            errorLog.innerText = "خطأ: " + err.message;
            errorLog.style.color = "#f87171";
        }
    }

    window.login = async function() {
        const email = document.getElementById('email').value.trim();
        const pass = document.getElementById('password').value;
        const errorLog = document.getElementById('errorLog');
        
        errorLog.innerText = "جاري الدخول...";
        errorLog.style.color = "#38bdf8";

        try {
            await signInWithEmailAndPassword(auth, email, pass);
            errorLog.innerText = "";
        } catch (err) {
            errorLog.innerText = "البيانات غير صحيحة";
            errorLog.style.color = "#f87171";
        }
    }

    window.logout = function() {
        signOut(auth).then(() => { location.reload(); });
    }

    // ------------------------------------
    // مراقبة حالة الاتصال والتوجيه للشاشات
    // ------------------------------------
    onAuthStateChanged(auth, (user) => {
        document.getElementById('loading').classList.add('hidden');
        
        if (user) {
            currentUserId = user.uid;
            document.getElementById('authSection').classList.add('hidden');
            
            // جلب البيانات بشكل مستمر
            onSnapshot(doc(db, "users", user.uid), (docSnap) => {
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    currentUserCustomId = data.customId;
                    
                    if (data.isAdmin) {
                        document.getElementById('adminSection').classList.remove('hidden');
                        document.getElementById('userSection').classList.add('hidden');
                    } else {
                        document.getElementById('userSection').classList.remove('hidden');
                        document.getElementById('adminSection').classList.add('hidden');
                        
                        document.getElementById('u_balance').innerText = data.balance.toLocaleString();
                        document.getElementById('u_id').innerText = data.customId;
                        
                        loadLogs(data.customId);
                    }
                    document.getElementById('statusMsg').innerText = "🟢 متصل: " + data.email;
                }
            });
        } else {
            document.getElementById('authSection').classList.remove('hidden');
            document.getElementById('userSection').classList.add('hidden');
            document.getElementById('adminSection').classList.add('hidden');
            document.getElementById('statusMsg').innerText = "🔴 غير متصل";
        }
    });

    // ------------------------------------
    // جلب سجل التحويلات
    // ------------------------------------
    function loadLogs(myId) {
        const q = query(collection(db, "transactions"), 
            where("involvedIds", "array-contains", myId), 
            orderBy("timestamp", "desc"), 
            limit(20)
        );

        onSnapshot(q, (snap) => {
            let h = "";
            snap.forEach(document => {
                const d = document.data();
                const isIn = (d.toId === myId);
                const timeString = d.timestamp ? d.timestamp.toDate().toLocaleString('ar-EG') : 'الآن';
                
                h += `<tr>
                    <td class="${isIn ? 'in' : 'out'}">${isIn ? 'استلام' : 'إرسال'}</td>
                    <td>${isIn ? d.fromId : d.toId}</td>
                    <td>${d.amount}</td>
                    <td>${timeString}</td>
                </tr>`;
            });
            
            if(h === "") h = "<tr><td colspan='4'>لا توجد عمليات</td></tr>";
            document.getElementById('historyBody').innerHTML = h;
        });
    }

    // ------------------------------------
    // لعبة التفاحة
    // ------------------------------------
    window.playAppleGame = async function() {
        const amt = parseInt(document.getElementById('betAmount').value);
        const msgBox = document.getElementById('gameMsg');
        
        if(!amt || amt <= 0) {
            msgBox.innerText = "أدخل مبلغ صحيح"; msgBox.style.color = "#f87171"; return;
        }

        const userRef = doc(db, "users", currentUserId);
        const docSnap = await getDoc(userRef);
        
        if (docSnap.exists()) {
            const bal = docSnap.data().balance;
            if (bal < amt) {
                msgBox.innerText = "رصيدك لا يكفي للرهان!"; msgBox.style.color = "#f87171"; return;
            }

            let newBal = bal - amt;
            const isWin = Math.random() <= 0.20; // نسبة الفوز 20%
            
            if(isWin) {
                newBal += (amt * 2);
                msgBox.innerText = `🎉 مبروك! كسبت ${amt * 2} كوينز`;
                msgBox.style.color = "#4ade80";
            } else {
                msgBox.innerText = "😢 خسرت الرهان. جرب تاني!";
                msgBox.style.color = "#f87171";
            }
            
            await updateDoc(userRef, { balance: newBal });
        }
    }

    // ------------------------------------
    // وظائف الأدمن
    // ------------------------------------
    window.generateMillion = async function() {
        await updateDoc(doc(db, "users", currentUserId), {
            balance: increment(1000000)
        });
        document.getElementById('adminMsg').innerText = "تمت إضافة مليون كوينز بنجاح!";
        document.getElementById('adminMsg').style.color = "#4ade80";
    }

    window.adminSend = async function() {
        const tid = document.getElementById('targetId').value;
        const amt = parseInt(document.getElementById('sendAmount').value);
        const msgBox = document.getElementById('adminMsg');
        
        if(!tid || !amt || amt <= 0) {
            msgBox.innerText = "أدخل البيانات بشكل صحيح"; msgBox.style.color = "#f87171"; return;
        }

        const q = query(collection(db, "users"), where("customId", "==", tid));
        const querySnapshot = await getDocs(q);

        if (querySnapshot.empty) {
            msgBox.innerText = "لا يوجد لاعب بهذا الـ ID"; msgBox.style.color = "#f87171"; return;
        }

        const targetUserDoc = querySnapshot.docs[0];
        
        // تحديث رصيد اللاعب
        await updateDoc(doc(db, "users", targetUserDoc.id), {
            balance: increment(amt)
        });

        // إضافة سجل المعاملة
        await addDoc(collection(db, "transactions"), {
            fromId: "ADMIN",
            toId: tid,
            amount: amt,
            involvedIds: [tid, "ADMIN"],
            timestamp: serverTimestamp()
        });

        msgBox.innerText = `تم إرسال ${amt} كوينز بنجاح`;
        msgBox.style.color = "#4ade80";
    }
</script>
</body>
</html>
